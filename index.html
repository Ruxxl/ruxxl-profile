<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Profile</title>
<style>
  :root{
    --bg:#0b0d0c; --panel:#0f1211; --line:#1d2421; --text:#d7e0db; --dim:#7b8a83;
    --g0:#14201a; --g1:#0e4429; --g2:#006d32; --g3:#26a641; --g4:#39d353;
    --mono: ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0}
  body{background:#050606;color:var(--text);font-family:var(--mono);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:24px}
  .win{width:min(1100px,100%);background:var(--bg);border:1px solid var(--line);border-radius:14px;
    overflow:hidden;box-shadow:0 30px 80px #000a}
  .bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);
    font-size:12px;color:var(--dim)}
  .dot{width:11px;height:11px;border-radius:50%}
  .bar .t{margin-left:auto;margin-right:auto}
  .grid{display:grid;grid-template-columns:260px 1fr;gap:0}
  aside{padding:24px;border-right:1px solid var(--line)}
  .avatar{width:120px;height:120px;border-radius:50%;background:#1a2320 center/cover;
    border:2px solid var(--line);display:grid;place-items:center;font-size:42px;color:var(--g4)}
  h1{font-size:18px;margin-top:16px}
  .handle{color:var(--g4);font-size:13px;margin-top:2px}
  .bio{color:var(--dim);font-size:12px;line-height:1.6;margin-top:14px}
  ul{list-style:none;padding:0;margin-top:18px;font-size:12px;display:grid;gap:8px;color:var(--dim)}
  ul b{color:var(--text);font-weight:500}
  .badges{display:flex;gap:8px;margin-top:20px}
  .badge{width:30px;height:30px;border-radius:50%;background:#16201b;border:1px solid var(--line);
    display:grid;place-items:center;font-size:14px}
  main{padding:24px;display:grid;gap:22px}
  .cmd{font-size:12px;color:var(--dim)} .cmd i{color:var(--g4);font-style:normal}
  .heat-wrap{overflow-x:auto}
  .heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;width:max-content}
  .heat span{width:11px;height:11px;border-radius:2px;background:var(--g0)}
  .heat .l1{background:var(--g1)}.heat .l2{background:var(--g2)}.heat .l3{background:var(--g3)}.heat .l4{background:var(--g4)}
  .sub{font-size:12px;color:var(--dim);margin-top:8px}
  .row{display:grid;grid-template-columns:240px 1fr;gap:24px;align-items:center}
  canvas#portrait{width:240px;height:240px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
  .stat b{display:block;font-size:22px;color:var(--g4)}
  .stat span{font-size:11px;color:var(--dim)}
  .bars{display:flex;align-items:flex-end;gap:5px;height:90px;margin-top:14px}
  .bars div{flex:1;background:linear-gradient(var(--g4),var(--g2));border-radius:2px 2px 0 0;min-height:3px}
  @media(max-width:760px){.grid{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}
    .row{grid-template-columns:1fr}.scan{margin:auto}}
  .heat span{opacity:0;will-change:opacity,filter}
  .bars div{transform-origin:bottom;transform:scaleY(0)}
  .scan{position:relative;width:240px;height:240px}
  .scan i{position:absolute;left:0;right:0;height:2px;background:var(--g4);box-shadow:0 0 14px 3px var(--g4);opacity:0;pointer-events:none}
  .caret::after{content:"▍";color:var(--g4);animation:bl 1s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}
  .replay{margin-left:auto;background:none;border:1px solid var(--line);color:var(--dim);font:inherit;font-size:11px;border-radius:6px;padding:3px 9px;cursor:pointer}
  .replay:hover{color:var(--g4);border-color:var(--g4)}
</style>
</head>
<body>
<div class="win">
  <div class="bar">
    <span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span>
    <span class="t" id="title"></span><button class="replay" id="replay">↻ replay</button>
  </div>
  <div class="grid">
    <aside>
      <div class="avatar" id="avatar"></div>
      <h1 id="name"></h1>
      <div class="handle" id="handle"></div>
      <p class="bio" id="bio"></p>
      <ul id="links"></ul>
      <div class="badges"><div class="badge">🏆</div><div class="badge">⭐</div><div class="badge">🚀</div><div class="badge">🔥</div></div>
    </aside>
    <main>
      <div>
        <div class="cmd"><i>$</i> <span id="c1"></span></div>
        <div class="heat-wrap" style="margin-top:12px"><div class="heat" id="heat"></div></div>
        <div class="sub" id="total"></div>
      </div>
      <div class="row">
        <div class="scan"><canvas id="portrait" width="480" height="480"></canvas><i id="scanline"></i></div>
        <div>
          <div class="cmd"><i>$</i> <span id="c2"></span></div>
          <div class="stats" id="stats" style="margin-top:12px"></div>
          <div class="bars" id="bars"></div>
          <div class="sub">commits per month</div>
        </div>
      </div>
    </main>
  </div>
</div>

// =========================================

const $ = id => document.getElementById(id);
$("title").textContent = `${ME.username}@github — ~/contributions.sh`;
$("name").textContent = ME.name;
$("handle").textContent = "@" + ME.username;
$("bio").textContent = ME.bio;
$("links").innerHTML = ME.links.map(([i,t])=>`<li>${i} <b>${t}</b></li>`).join("");
$("stats").innerHTML = ME.stats.map(([l,v])=>`<div class="stat"><b data-val="${v.replace(/,/g,'')}">0</b><span>${l}</span></div>`).join("");
const mx = Math.max(...ME.monthly);
$("bars").innerHTML = ME.monthly.map(v=>`<div style="height:${v/mx*100}%"></div>`).join("");

// ---------- Рендер ----------
const heat = $("heat"), mxc = Math.max(...ME.counts);
heat.insertAdjacentHTML("beforeend", '<span style="visibility:hidden"></span>'.repeat(ME.firstDow));
ME.counts.forEach((n,i)=>{
  const l = n===0?0:Math.min(4,Math.ceil(n/mxc*4));
  heat.insertAdjacentHTML("beforeend",`<span class="${l?'l'+l:''}" data-c="${Math.floor((i+ME.firstDow)/7)}" title="${n}"></span>`);
});
const cells = [...heat.querySelectorAll("span[data-c]")], COLS = Math.max(...cells.map(c=>+c.dataset.c))+1;
$("total").textContent = `${ME.total.toLocaleString()} contributions in the last year`;

const av = $("avatar");
if (ME.avatar){ av.style.backgroundImage = `url(${ME.avatar})`; }
else { av.textContent = ME.name.split(" ").map(s=>s[0]).join("").slice(0,2); }

// Полутоновые точки портрета (по строкам, для построчной прорисовки)
const cv = $("portrait"), ctx = cv.getContext("2d"), N = 480, G = 96, step = N/G;
let dots = [];
function buildDots(src){
  const t = document.createElement("canvas"); t.width=t.height=G;
  const tc = t.getContext("2d"); tc.drawImage(src,0,0,G,G);
  const d = tc.getImageData(0,0,G,G).data; dots=[];
  for(let y=0;y<G;y++)for(let x=0;x<G;x++){
    const k=(y*G+x)*4, lum=(d[k]*.3+d[k+1]*.59+d[k+2]*.11)/255, r=(1-lum)*step*0.62;
    if(r>=0.4) dots.push([x*step+step/2,y*step+step/2,r]);
  }
}
function placeholderSrc(){
  const t=document.createElement("canvas"); t.width=t.height=G; const c=t.getContext("2d");
  c.fillStyle="#fff"; c.fillRect(0,0,G,G); const g=c.createRadialGradient(48,40,6,48,48,44);
  g.addColorStop(0,"#222"); g.addColorStop(1,"#fff"); c.fillStyle=g;
  c.beginPath(); c.arc(48,38,22,0,7); c.fill(); c.beginPath(); c.ellipse(48,92,38,30,0,0,7); c.fill(); return t;
}
const ready = new Promise(res=>{
  if(!ME.avatar){ buildDots(placeholderSrc()); return res(); }
  const im=new Image(); im.crossOrigin="anonymous";
  im.onload=()=>{buildDots(im);res()}; im.onerror=()=>{buildDots(placeholderSrc());res()}; im.src=ME.avatar;
});

// ---------- Анимация ----------
const ease = t=>1-Math.pow(1-t,3), clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const sleep = ms=>new Promise(r=>setTimeout(r,ms));
let run = 0;
async function type(el, text, id){
  el.classList.add("caret"); el.textContent="";
  for(const ch of text){ if(id!==run) return; el.textContent+=ch; await sleep(35); }
  el.classList.remove("caret");
}
function frame(dur, fn, id){
  return new Promise(res=>{ const t0=performance.now();
    (function tick(now){ if(id!==run) return res();
      const p=clamp((now-t0)/dur); fn(p); p<1?requestAnimationFrame(tick):res(); })(t0); });
}
const bars = [...$("bars").children], nums = [...document.querySelectorAll(".stat b")];

async function play(){
  const id = ++run;
  // reset
  cells.forEach(c=>{c.style.opacity=0;c.style.filter=""});
  bars.forEach(b=>b.style.transform="scaleY(0)");
  nums.forEach(n=>n.textContent="0");
  ctx.clearRect(0,0,N,N); $("scanline").style.opacity=0;
  $("c1").textContent=$("c2").textContent=""; $("total").style.opacity=0;
  await ready; if(id!==run) return;

  await type($("c1"), "./contributions.sh", id);
  // 1) тепловая карта: волна слева направо, свечение на фронте
  const W = 6; // ширина «свечения» в колонках
  const heatP = frame(3200, p=>{
    const front = p*(COLS+W);
    for(const c of cells){
      const d = front - c.dataset.c;           // >0 — волна уже прошла
      const o = clamp(d/1.5);
      const glow = d>0 && d<W ? 1+ (1-d/W)*1.8 : 1;
      c.style.opacity = o; c.style.filter = glow>1 ? `brightness(${glow.toFixed(2)}) saturate(1.3)` : "";
    }
  }, id).then(()=>{ $("total").style.transition="opacity .6s"; $("total").style.opacity=1; });

  await sleep(500);
  type($("c2"), "git stats --me", id);

  // 2) портрет: прорисовка сверху вниз со сканирующей линией
  const sl = $("scanline"), sorted = dots; // уже упорядочены по строкам
  let drawn = 0;
  const portraitP = frame(3600, p=>{
    const y = ease(p)*N, line = sl;
    line.style.opacity = p<1?1:0; line.style.top = (y/N*240)+"px";
    ctx.fillStyle="#7fe39a";
    while(drawn<sorted.length && sorted[drawn][1]<=y){
      const [x,yy,r]=sorted[drawn++]; ctx.beginPath(); ctx.arc(x,yy,r,0,7); ctx.fill();
    }
  }, id);

  // 3) числа считаются, 4) столбцы растут по очереди
  const numsP = frame(2200, p=>{
    nums.forEach(n=>{
      const raw=n.dataset.val, v=parseFloat(raw), cur=v*ease(p);
      n.textContent = Number.isInteger(v) ? Math.round(cur).toLocaleString("en-US") : cur.toFixed(1);
    });
  }, id);
  const barsP = frame(2400, p=>{
    bars.forEach((b,i)=>{ const local=clamp(p*1.6 - i/bars.length*0.6); b.style.transform=`scaleY(${ease(local)})`; });
  }, id);
  await Promise.all([heatP, portraitP, numsP, barsP]);
}
$("replay").onclick = play;
play();
